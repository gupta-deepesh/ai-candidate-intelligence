server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-resume-analyzer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:demo-key-not-used-in-mock-mode}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
          temperature: 0.2
          max-tokens: 8192

app:
  ai:
    mock: ${APP_AI_MOCK:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
